<!--
  FilterBar — barra filtri orizzontale, Design System "Editorial Gastronomy"
  ---------------------------------------------------------------------------
  • È un normale <form method="get">: i filtri finiscono nell'URL
    (/cantine?provincia=AN&denominazione=conero-docg). Funziona senza JS,
    è condivisibile e indicizzabile, e il Worker fa SSR + cache per URL.
  • Mobile: riga di chip scorrevole (snap) + pannelli a "bottom sheet".
    Desktop: stessa riga, pannelli centrati. Pannelli = Popover API nativa
    (zero librerie, Esc e click esterno gestiti dal browser).
  • Il piccolo script in fondo è solo progressive enhancement: contatori sui
    chip e invio immediato dei toggle rapidi. "Azzera" è un link a /cantine.
-->
<form id="filters" method="get" action="/cantine" role="search" aria-label="Filtra le cantine"
  class="sticky top-0 z-30 border-b border-subtle bg-primary/95 backdrop-blur supports-[backdrop-filter]:bg-primary/85">
  <div class="mx-auto max-w-6xl px-4 py-3 sm:px-6">

    <!-- Ricerca -->
    <label for="q" class="sr-only">Cerca cantina, comune o vino</label>
    <div class="relative">
      <svg class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-muted" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/>
      </svg>
      <input id="q" name="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
        placeholder="Cantina, borgo o vino…"
        class="h-11 w-full rounded-md border border-subtle bg-primary pl-9 pr-3 text-[15px] text-main placeholder:text-muted/80 focus:border-main focus:outline-none">
    </div>

    <!-- Riga chip orizzontale -->
    <div class="mt-3 flex items-center gap-3">
      <div class="scroll-row -mx-4 flex min-w-0 flex-1 snap-x scroll-px-4 gap-2 overflow-x-auto px-4 sm:mx-0 sm:scroll-px-0 sm:px-0">

        <button type="button" popovertarget="f-provincia" data-filter="provincia"
          class="chip snap-start inline-flex h-9 shrink-0 items-center gap-1.5 rounded-md border border-subtle bg-primary px-3 text-sm text-main transition-colors hover:border-main data-[active]:border-wine data-[active]:bg-wine data-[active]:text-primary">
          <span>Provincia</span><span data-count class="tabular-nums"></span>
          <svg class="size-3.5 opacity-70" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg>
        </button>

        <button type="button" popovertarget="f-denominazione" data-filter="denominazione"
          class="chip snap-start inline-flex h-9 shrink-0 items-center gap-1.5 rounded-md border border-subtle bg-primary px-3 text-sm text-main transition-colors hover:border-main data-[active]:border-wine data-[active]:bg-wine data-[active]:text-primary">
          <span>Denominazione</span><span data-count class="tabular-nums"></span>
          <svg class="size-3.5 opacity-70" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg>
        </button>

        <button type="button" popovertarget="f-vitigno" data-filter="vitigno"
          class="chip snap-start inline-flex h-9 shrink-0 items-center gap-1.5 rounded-md border border-subtle bg-primary px-3 text-sm text-main transition-colors hover:border-main data-[active]:border-wine data-[active]:bg-wine data-[active]:text-primary">
          <span>Vitigno</span><span data-count class="tabular-nums"></span>
          <svg class="size-3.5 opacity-70" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg>
        </button>

        <button type="button" popovertarget="f-servizi" data-filter="servizio"
          class="chip snap-start inline-flex h-9 shrink-0 items-center gap-1.5 rounded-md border border-subtle bg-primary px-3 text-sm text-main transition-colors hover:border-main data-[active]:border-wine data-[active]:bg-wine data-[active]:text-primary">
          <span>Servizi</span><span data-count class="tabular-nums"></span>
          <svg class="size-3.5 opacity-70" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg>
        </button>

        <span class="my-1.5 w-px shrink-0 bg-subtle" aria-hidden="true"></span>

        <!-- Toggle rapidi: checkbox stilizzate come chip -->
        <label class="relative snap-start shrink-0">
          <input type="checkbox" name="aperto" value="oggi" class="peer sr-only" data-autosubmit>
          <span class="inline-flex h-9 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm text-main transition-colors hover:border-main peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-wine">Aperto oggi</span>
        </label>
        <label class="relative snap-start shrink-0">
          <input type="checkbox" name="servizio" value="degustazioni" class="peer sr-only" data-autosubmit>
          <span class="inline-flex h-9 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm text-main transition-colors hover:border-main peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-wine">Degustazioni</span>
        </label>
        <label class="relative snap-start shrink-0">
          <input type="checkbox" name="shop" value="1" class="peer sr-only" data-autosubmit>
          <span class="inline-flex h-9 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm text-main transition-colors hover:border-main peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-wine">Shop online</span>
        </label>

        <a href="/cantine"
          class="snap-start inline-flex h-9 shrink-0 items-center px-2 text-sm text-muted underline decoration-subtle underline-offset-4 hover:text-main">
          Azzera

      </div>

      <!-- Vista lista / mappa (solo desktop qui; su mobile è un FAB in basso) -->
      <div role="group" aria-label="Vista" class="hidden shrink-0 rounded-md border border-subtle p-0.5 md:flex">
        <a href="/cantine?view=list" aria-current="page" class="meta rounded-[5px] px-3 py-2 text-[10px] text-muted aria-[current=page]:bg-main aria-[current=page]:text-primary">Lista</a>
        <a href="/cantine?view=map" class="meta rounded-[5px] px-3 py-2 text-[10px] text-muted hover:text-main">Mappa</a>

  <!-- ===================== Pannelli (Popover API) ===================== -->

        <label class="relative"><input type="checkbox" name="provincia" value="MC" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Macerata</span></label>
        <label class="relative"><input type="checkbox" name="provincia" value="FM" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Fermo</span></label>
        <label class="relative"><input type="checkbox" name="provincia" value="AP" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Ascoli Piceno</span></label>

        <label class="relative"><input type="checkbox" name="denominazione" value="rosso-piceno" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Rosso Piceno</span></label>

  </div>

  <div id="f-vitigno" popover
    class="fixed inset-x-0 bottom-0 top-auto m-0 w-full max-w-none rounded-t-md border border-subtle bg-primary p-0 text-main backdrop:bg-main/30 md:inset-0 md:m-auto md:h-fit md:w-[26rem] md:rounded-md">
    <fieldset class="p-5">
      <legend class="meta float-left mb-4 w-full text-muted">Vitigno</legend>
      <div class="clear-both flex flex-wrap gap-2">
        <label class="relative"><input type="checkbox" name="vitigno" value="verdicchio" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Verdicchio</span></label>
        <label class="relative"><input type="checkbox" name="vitigno" value="montepulciano" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Montepulciano</span></label>
        <label class="relative"><input type="checkbox" name="vitigno" value="lacrima" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Lacrima</span></label>
        <label class="relative"><input type="checkbox" name="vitigno" value="pecorino" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Pecorino</span></label>

      <legend class="meta float-left mb-4 w-full text-muted">Servizi in cantina</legend>
      <div class="clear-both flex flex-wrap gap-2">
        <label class="relative"><input type="checkbox" name="servizio" value="visita-vigneto" class="peer sr-only"><span class="inline-flex h-10 cursor-pointer items-center rounded-md border border-subtle px-3 text-sm peer-checked:border-wine peer-checked:bg-wine peer-checked:text-primary peer-focus-visible:outline-2 peer-focus-visible:outline-wine">Visita in vigna</span></label>

</form>

<script type="module">
  // Progressive enhancement: contatori sui chip e invio immediato dei toggle rapidi.
  const form = document.getElementById('filters');
  const sync = () => {
    form.querySelectorAll('.chip[data-filter]').forEach((chip) => {
      const panel = document.getElementById(chip.getAttribute('popovertarget'));
      const n = panel.querySelectorAll('input:checked').length;
      chip.querySelector('[data-count]').textContent = n ? `· ${n}` : '';
      chip.toggleAttribute('data-active', n > 0);
    });
  };
  form.addEventListener('change', (e) => {
    sync();
    if (e.target.matches('[data-autosubmit]')) form.requestSubmit();
  });
  sync();
</script>
